[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "scanpy-zi"
version = "0.1.0"
description = "Zero-inflated decomposition for single-cell differential expression analysis"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [
    { name = "Node Biosciences, Inc." }
]
keywords = [
    "single-cell",
    "rna-seq",
    "differential-expression",
    "zero-inflated",
    "spatial-transcriptomics",
    "scanpy",
    "bioinformatics"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "numpy>=1.21",
    "scipy>=1.7",
    "pandas>=1.3",
    "anndata>=0.8",
    "statsmodels>=0.13",
    "matplotlib>=3.5",
]

[project.optional-dependencies]
scanpy = ["scanpy>=1.10"]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.1",
]
docs = [
    "sphinx>=5.0",
    "sphinx-rtd-theme>=1.0",
]

[project.urls]
Homepage = "https://github.com/node-bio/scanpy-zi"
Documentation = "https://github.com/node-bio/scanpy-zi#readme"
Repository = "https://github.com/node-bio/scanpy-zi"
Issues = "https://github.com/node-bio/scanpy-zi/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/scanpy_zi"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --cov=scanpy_zi --cov-report=term-missing"
